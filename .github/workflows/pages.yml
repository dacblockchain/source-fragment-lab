name: pages

# Publishes web/ to GitHub Pages. Skipped while the repository is private.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Public repositories only, for allow-listed people only (see ci.yml), and the
    # github-pages environment additionally requires a maintainer's approval.
    if: ${{ !github.event.repository.private && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '[]'), github.actor) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '[]'), github.triggering_actor) }}
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Demo files must match testdata/
        run: cmp testdata/demo-fragment.bin web/demo/demo-fragment.bin && cmp testdata/demo-fragment.proof.json web/demo/demo-fragment.proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
