name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs on the organisation's self-hosted runner, and only for people
# listed in the repository variable CI_ALLOWED_ACTORS (a JSON array of GitHub
# logins, editable by admins only). Both the actor and whoever re-ran the job
# must be on the list. Pull requests from forks never run here: a maintainer
# reviews the change and pushes it to a branch of this repository first.
jobs:
  gate:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '[]'), github.actor) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '[]'), github.triggering_actor) }}
    runs-on: self-hosted
    steps:
      - run: echo "CI allowed for $ACTOR"
        env:
          ACTOR: ${{ github.triggering_actor }}

  python:
    needs: gate
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov=fragmentlab --cov-fail-under=85

  web:
    needs: gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'web/tests/*.test.mjs'
      - name: Demo files in web/ must match testdata/
        run: cmp testdata/demo-fragment.bin web/demo/demo-fragment.bin && cmp testdata/demo-fragment.proof.json web/demo/demo-fragment.proof.json

  reference-verifier:
    # The demo fragment must also pass the verifier Interstellar publishes itself.
    needs: gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project python tools/verify_reference.py testdata/demo-fragment.bin testdata/demo-fragment.proof.json
