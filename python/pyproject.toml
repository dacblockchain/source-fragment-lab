[project]
name = "source-fragment-lab"
version = "0.1.0"
description = "Examples for using a Source Fragment (quantum entropy won on DAC Interstellar) safely off-chain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=43"]

[project.scripts]
fragmentlab = "fragmentlab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pyrage>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fragmentlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
